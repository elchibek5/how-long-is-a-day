<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- textures are requested as relative "textures/x.jpg", exactly like the real index.html at the root -->
  <base href="/" />
  <title>Space harness</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <style>
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    #space { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; display: block; }
    main { position: relative; z-index: 1; }
    #hero { height: 100vh; display: grid; grid-template-columns: 45fr 55fr; align-items: center; }
    #hero .title { grid-column: 2; padding-right: 7vw; }
    #hero h1 { font: 600 clamp(44px, 6.4vw, 104px)/0.92 var(--font-display); letter-spacing: -0.035em; margin: 18px 0 22px; }
    #hero h1 em { font: italic 400 1.04em/1 var(--font-serif); color: var(--sun); letter-spacing: -0.01em; }
    #hero p { color: var(--text-2); max-width: 30ch; font-size: 18px; line-height: 1.5; margin: 0; }
    .planet-stage { height: 200vh; position: relative; }
    .sticky { position: sticky; top: 0; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
    .card { justify-self: center; width: min(400px, 38vw); padding: 28px 30px; box-sizing: border-box; }
    .card h2 { font: 600 44px/1 var(--font-display); margin: 12px 0 10px; letter-spacing: -0.02em; }
    .card p { margin: 0; color: var(--text-2); line-height: 1.55; font-size: 15px; }
    .planet-slot { aspect-ratio: 1; width: min(44vw, 72vh); justify-self: center; }
    .debug .planet-slot { outline: 1px dashed rgba(255, 255, 255, 0.25); }
    .tail { height: 150vh; display: grid; place-items: center; color: var(--muted); }
    #load { position: fixed; left: 16px; bottom: 14px; z-index: 2; font: 500 12px var(--font-mono); color: var(--muted); }
    @media (max-width: 700px) {
      #hero { grid-template-columns: 1fr; align-items: end; }
      #hero .title { grid-column: 1; padding: 0 22px 12vh; }
      .sticky { grid-template-columns: 1fr; align-content: start; gap: 4vh; }
      .planet-slot { width: 86vw; margin-top: 7vh; grid-row: 1; }
      .card { grid-row: 2; width: calc(100vw - 32px); }
    }
  </style>
</head>
<body>
  <canvas id="space"></canvas>
  <main>
    <section id="hero">
      <div class="title">
        <span class="eyebrow">Geometry midterm · eight worlds</span>
        <h1>How long is <em>a day?</em></h1>
        <p>The geometry of sunrise on every planet, from Mercury's two-year day to Uranus rolling on its side.</p>
      </div>
    </section>
    <div id="stages"></div>
    <section class="tail"><p class="mono">— end of tour —</p></section>
  </main>
  <div id="load">loading…</div>
  <script type="module">
    import { PLANETS } from '/src/data/planets.js';
    import { initSpace } from '/src/scene/space.js';

    if (new URLSearchParams(location.search).has('debug')) document.documentElement.classList.add('debug');
    const host = document.getElementById('stages');
    for (const p of PLANETS) {
      const s = document.createElement('section');
      s.className = 'planet-stage';
      s.dataset.planet = p.id;
      s.innerHTML = `<div class="sticky">
        <div class="card panel"><span class="eyebrow">${p.tiltDeg}° tilt · ${p.spinHours} h spin</span><h2>${p.name}</h2><p>${p.tagline}. ${p.fact}</p></div>
        <div class="planet-slot"></div>
      </div>`;
      host.appendChild(s);
    }

    const load = document.getElementById('load');
    window.addEventListener('space:progress', (e) => { load.textContent = `textures ${e.detail.loaded}/${e.detail.total}`; });
    const { ready } = initSpace({
      canvas: document.getElementById('space'),
      hero: document.getElementById('hero'),
      stages: document.querySelectorAll('.planet-stage'),
    });
    ready.then(() => { load.textContent += ' · ready'; window.__spaceReady = true; });

    // ?autoscroll=30 scrolls N px per frame so a screenshot can catch the warp streaks
    const auto = Number(new URLSearchParams(location.search).get('autoscroll') || 0);
    if (auto) ready.then(() => { const step = () => { window.scrollBy(0, auto); requestAnimationFrame(step); }; step(); });
  </script>
</body>
</html>
